<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>내 연습용 사이트</title>
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <nav>
  <a href="index.html">홈</a> |
  <a href="post1.html">글</a> |
  <a href="about.html">소개</a>
</nav>
  <h1>안녕 여긴 내 사이트</h1>

  <div class="post-card" data-href="post1.html">
  <div class="post-title">첫 번째 글</div>
  <p>연습용으로 만든 첫 게시글임</p>
  <div class="post-meta">
    2026.02.05 · <span>#연습</span> <span>#첫글</span>
  </div>
</div>

<div class="post-card" data-href="post2.html" role="link" tabindex="0">
  <div class="post-title">두 번째 글</div>
  <p>연습용으로 만든 두번째 게시글임</p>
  <div class="post-meta">
    2026.02.06 · <span>#연습</span> <span>#첫글</span>
  </div>
</div>

<div class="post-card" data-href="post3.html" role="link" tabindex="0">
  <div class="post-title">세 번째 글</div>
  <p>연습용으로 만든 세번째 게시글임</p>
  <div class="post-meta">
    2026.02.07 · <span>#연습</span> <span>#첫글</span>
  </div>
</div>
</div>
<script>
  document.querySelectorAll('.post-card').forEach(card => {
    const go = () => { location.href = card.dataset.href }

    card.addEventListener('click', go)
    card.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go() }
    })

    card.addEventListener('touchstart', () => card.classList.add('pressed'), {passive:true})
    card.addEventListener('touchend', () => card.classList.remove('pressed'))
    card.addEventListener('touchcancel', () => card.classList.remove('pressed'))
  })
</script>
</body>
</html>
